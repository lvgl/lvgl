description: LVGL - Light and Versatile Graphics Library
url: https://lvgl.io/
repository: https://github.com/lvgl/lvgl.git
documentation: https://docs.lvgl.io/
issues: https://github.com/lvgl/lvgl/issues
files:
  exclude:
    - "tests/**/*"
    - "env_support/cmsis-pack/**/*"
    - "demos/**/screenshot*"
    - "docs/src/**/*"
    - "libs/nema_gfx/**/*"
    - "scripts/generators/built_in_font/**/*"
dependencies:
  espressif/freetype:
    require: private
    version: "^2.14.3"
    rules:
      - if: "idf_version >=5.5 && $CONFIG{LV_USE_FREETYPE} == True"
  espressif/libjpeg-turbo:
    require: private
    version: "^3.1.1"
    rules:
      - if: "idf_version >=5.5 && $CONFIG{LV_USE_LIBJPEG_TURBO} == True"
  espressif/libpng:
    require: private
    version: "^1.6.58"
    rules:
      - if: "idf_version >=5.5 && $CONFIG{LV_USE_LIBPNG} == True"
  espressif/lz4:
    require: private
    version: "^1.10.0"
    rules:
      - if: "idf_version >=5.5 && $CONFIG{LV_USE_LZ4} == True && $CONFIG{LV_USE_LZ4_INTERNAL} == False"
