name: Emulated Performance Test

on:
  push:
    branches: 'master'
  pull_request:
    branches: 'master'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }} 
  cancel-in-progress: true

jobs:
  check_scripts:
    runs-on: ubuntu-24.04
    name: ARM Emulated Benchmark - Script Check
    strategy:
      fail-fast: false
      matrix: 
        test_script:
          - scripts/perf/tests/filter_docker_logs/test.sh
          - scripts/perf/tests/benchmark_results_comment/test.sh
          # This script isn't executed in this workflow directly. Instead, it's run
          # by the `Emulated Performance Test Results Handler` workflow.
          # That workflow runs in the context of the `master` branch, so this workflow ensures
          # the script is tested in the PR context before merging. Helping to prevent CI failures in `master`
          - scripts/perf/tests/serialize_results/test.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Script
        run: |
          pip3 install msgpack==1.1.0
          ./${{ matrix.test_script }}

  run_benchmark:
    runs-on: ubuntu-24.04
    name: ARM Emulated Benchmark ${{ matrix.image_type }} - ${{matrix.config }}
    needs: check_scripts
    strategy:
      fail-fast: false
      matrix:
        # Pinned by digest to the SO3 6.2.0 nested-layout images (built from the
        # :lvgl Dockerfiles). The digests and the /so3/so3/usr mount paths in the
        # "Run Benchmark Demo" step below must always change together.
        include:
        - image_type: 32b
          image_version : |
            latest@sha256:8d977ad76d3893bae23e9bfda3217390afe24ba448852edd7579fb8e5fa38a23
          config : lv_conf_perf32b
        - image_type: 64b
          image_version: |
            latest@sha256:1d3674adb634be728d79ffeff37e55183d3d9d228cd536266fa5db444ee0ce77
          config : lv_conf_perf64b
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate lv_conf.h
        run: |
          python scripts/generate_lv_conf.py \
            --template lv_conf_template.h \
            --config configs/ci/perf/lv_conf_perf.h \
            --defaults configs/ci/perf/${{matrix.config}}.defaults
      - name: Run Benchmark Demo
        run: |
          # Mounts the current lvgl source code into the container and runs the demo benchmark
          # To add additional build dependencies, modify the `lvperf_dependencies.sh` script
          docker run -t --privileged \
            --name so3-lvperf \
            -v /dev:/dev \
            -v $(pwd)/configs/ci/perf/lv_conf_perf.h:/so3/so3/usr/lib/lv_conf.h \
            -v $(pwd):/so3/so3/usr/lib/lvgl \
            -v $(pwd)/scripts/perf/lvperf_dependencies.sh:/so3/install_dependencies.sh \
            ghcr.io/smartobjectoriented/so3-lvperf${{matrix.image_type}}:${{matrix.image_version}}

      - name: Collect Logs
        run: |
          sudo cat $(docker inspect --format='{{.LogPath}}' so3-lvperf) | python scripts/perf/filter_docker_benchmark_logs.py results-${{matrix.image_type}}-${{matrix.config}}.json

      - name: Upload Results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{matrix.image_type}}-${{matrix.config}}
          path: results-${{matrix.image_type}}-${{matrix.config}}.json
          if-no-files-found: error

  pr_report:
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    name: ARM Emulated Benchmark - PR Report
    needs: run_benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the results of this run
        if: ${{ needs.run_benchmark.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: results-*
          merge-multiple: true
          path: input

      - name: Collect 'master' Results
        if: ${{ needs.run_benchmark.result == 'success' }}
        # The baseline is a public pre-release, so this needs no more than the
        # read-only token a pull request from a fork gets
        uses: robinraju/release-downloader@v1
        continue-on-error: true # The release may not exist yet
        with:
          preRelease: true
          tag: emulated-benchmark-latest
          fileName: results*.mpk

      - name: Build the PR report section
        if: ${{ needs.run_benchmark.result == 'success' }}
        run: |
          pip3 install msgpack==1.1.0
          if ls results*.mpk 1> /dev/null 2>&1; then
            python3 scripts/perf/benchmark_results_comment.py \
              --previous results*.mpk \
              --new input/results*.json \
              --output comment.md \
              --report reports/performance.json
          else
            echo "No previous results found, generating comment without comparison."
            python3 scripts/perf/benchmark_results_comment.py \
              --new input/results*.json \
              --output comment.md \
              --report reports/performance.json
          fi
          # The report section points at this summary for the full tables
          cat comment.md >> $GITHUB_STEP_SUMMARY

      - name: Note a missing report
        # A step above can fail before the report is written
        if: ${{ !cancelled() }}
        run: |
          [ -f reports/performance.json ] || \
            python3 scripts/pr_report/pr_report.py emit \
              --output reports/performance.json \
              --section "Performance" --icon warn \
              --summary "not available, the benchmark did not finish"

      - name: Upload the PR report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-report-performance
          path: reports/
          if-no-files-found: ignore
