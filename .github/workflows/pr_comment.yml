name: PR Report Comment

# Renders a single PR comment from the report artifacts that other workflows
# upload.
#
# Producers write a JSON file using `pr_report.py` library and upload it as 
# an artifact whose name starts with `pr-report`
#
# To add a section, list the producing workflow below and have it upload its
# report artifact

on:
  workflow_run:
    workflows:
      - "Build and Test"
      - "Static Checks"
      - "Emulated Performance Test"
      - "Memory Usage"
    types:
      - completed

concurrency:
  group: pr-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    name: Update the PR report comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the report artifacts for this commit
        id: reports
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const sha = context.payload.workflow_run.head_sha;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, head_sha: sha, per_page: 100 },
            );

            fs.mkdirSync('reports', { recursive: true });
            let found = 0;

            // Interate oldest to newest so we always get the latest results
            for (const run of runs.reverse()) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: run.id, per_page: 100 },
              );
              for (const artifact of artifacts) {
                if (!artifact.name.startsWith('pr-report') || artifact.expired) {
                  continue;
                }
                const { data } = await github.rest.actions.downloadArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync('artifact.zip', Buffer.from(data));
                execFileSync('unzip', ['-o', '-d', 'reports', 'artifact.zip'],
                             { stdio: 'inherit' });
                core.info(`downloaded ${artifact.name} from run ${run.id}`);
                found += 1;
              }
            }
            core.setOutput('found', String(found));

      - name: Resolve the pull request number
        id: pr
        if: steps.reports.outputs.found != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:pr sha:${sha}`,
            });
            if (!data.items.length) {
              core.info('no pull request found for this commit');
              return '';
            }
            return String(data.items[0].number);
          result-encoding: string

      - name: Render the comment
        if: steps.pr.outputs.result != ''
        run: |
          python3 scripts/pr_report/pr_report.py render \
            --input reports --output comment.md
          cat comment.md

      - name: Create or update the comment
        if: steps.pr.outputs.result != ''
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- lvgl-pr-report -->';
            const issue_number = Number('${{ steps.pr.outputs.result }}');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment(
                { ...context.repo, comment_id: existing.id, body });
              core.info(`updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment(
                { ...context.repo, issue_number, body });
              core.info('created the report comment');
            }
