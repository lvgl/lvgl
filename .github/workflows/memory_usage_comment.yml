name: Memory Usage Comment
on:
  workflow_run:
    workflows: ["Memory Usage"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

env:
  ARM_TOOLCHAIN_URL: https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
  ARM_TOOLCHAIN_DIR: gcc-arm-none-eabi-10.3-2021.10
  ESP_TOOLCHAIN_VERSION: 13.2.0_20230928

jobs:
  comment:
    name: Post size comparison comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      # Needed for report.py, and for measure.py if the master baseline has to be rebuilt.
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Download PR results artifact
        uses: actions/download-artifact@v4
        with:
          name: flash-usage-results
          path: results/pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: echo "number=$(cat results/pr/pr_number.txt)" >> "$GITHUB_OUTPUT"

      # --- Try to get master's baseline from its last successful "Memory Usage" run ---
      - name: Find latest successful master run
        id: master_run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "memory_usage.yml",
              branch: "master",
              status: "success",
              per_page: 1,
            });
            if (data.workflow_runs.length > 0) {
              core.setOutput("run_id", data.workflow_runs[0].id);
            } else {
              core.setOutput("run_id", "");
            }

      - name: Download master results artifact
        id: master_artifact
        if: steps.master_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: flash-usage-results
          path: results/master
          run-id: ${{ steps.master_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether master baseline is available
        id: check_master
        run: |
          if [ -f results/master/size-results.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Fallback: no artifact found (or download failed) -> build master ourselves ---
      - name: Checkout master
        if: steps.check_master.outputs.available == 'false'
        uses: actions/checkout@v6
        with:
          ref: master
          path: master-src

      - name: Install dependencies (fallback build)
        if: steps.check_master.outputs.available == 'false'
        run: |
          python3 -m pip install kconfiglib pcpp
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache toolchains (fallback build)
        if: steps.check_master.outputs.available == 'false'
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ARM_TOOLCHAIN_DIR }}
            xtensa-esp-elf
            riscv32-esp-elf
          key: memory-usage-toolchains-${{ env.ARM_TOOLCHAIN_DIR }}-esp${{ env.ESP_TOOLCHAIN_VERSION }}

      - name: Download toolchains (fallback build)
        if: steps.check_master.outputs.available == 'false' && steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "$ARM_TOOLCHAIN_URL"
          tar xjf "$(basename "$ARM_TOOLCHAIN_URL")"

          esp_base="https://github.com/espressif/crosstool-NG/releases/download/esp-${ESP_TOOLCHAIN_VERSION}"
          for tc in xtensa-esp-elf riscv32-esp-elf; do
            wget -q "${esp_base}/${tc}-${ESP_TOOLCHAIN_VERSION}-x86_64-linux-gnu.tar.xz"
            tar xf "${tc}-${ESP_TOOLCHAIN_VERSION}-x86_64-linux-gnu.tar.xz"
          done

      - name: Add toolchains to PATH (fallback build)
        if: steps.check_master.outputs.available == 'false'
        run: |
          {
            echo "${{ github.workspace }}/${{ env.ARM_TOOLCHAIN_DIR }}/bin"
            echo "${{ github.workspace }}/xtensa-esp-elf/bin"
            echo "${{ github.workspace }}/riscv32-esp-elf/bin"
          } >> "$GITHUB_PATH"

      - name: Build master from source
        id: build_master
        if: steps.check_master.outputs.available == 'false'
        continue-on-error: true
        working-directory: master-src/tests/test_memory_usage
        run: ./measure.py --out "$GITHUB_WORKSPACE/results/master/size-results.json"

      - name: Build comment body
        id: body
        run: |
          {
            echo "body<<COMMENT_EOF"
            tests/test_memory_usage/report.py \
              --pr results/pr \
              --master results/master
            echo "COMMENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const body = process.env.COMMENT_BODY;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = "## 📦 Flash / RAM usage";
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
        env:
          COMMENT_BODY: ${{ steps.body.outputs.body }}
