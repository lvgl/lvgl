name: Build and Package Artifact

on:
  pull_request:
    branches: [ master, release/* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-package-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: |
          scripts/install-prerequisites.sh
          sudo apt-get install -y librlottie-dev

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/linux-3d.defconfig \
            -DCONFIG_LV_USE_GSTREAMER=ON \
            -DCONFIG_LV_USE_GLTF=ON \
            -DCONFIG_LV_USE_3DTEXTURE=ON \
            -DCONFIG_LV_USE_FFMPEG=ON \
            -DCONFIG_LV_USE_LOTTIE=ON \
            -DCONFIG_LV_USE_THORVG=ON \
            -DCONFIG_LV_USE_RLOTTIE=ON \
            -DCONFIG_LV_USE_IME_PINYIN=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Stage outputs in out folder
        run: |
          mkdir -p out
          cp -a build out/build
          test -d out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-linux
          path: out
          if-no-files-found: error

  build-and-package-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            libsdl2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libavformat-dev libavcodec-dev libswscale-dev libavutil-dev \
            librlottie-dev libegl-dev libgles-dev \
            wayland-protocols libwayland-dev libwayland-bin \
            libdrm-dev libgbm-dev \
            libinput-dev libxkbcommon-dev libudev-dev libfreetype-dev \
            libpng-dev libjpeg-turbo8-dev libwebp-dev libevdev-dev
          python3 -m pip install kconfiglib

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/linux-3d.defconfig \
            -DCONFIG_LV_USE_GSTREAMER=ON \
            -DCONFIG_LV_USE_GLTF=ON \
            -DCONFIG_LV_USE_3DTEXTURE=ON \
            -DCONFIG_LV_USE_FFMPEG=ON \
            -DCONFIG_LV_USE_LOTTIE=ON \
            -DCONFIG_LV_USE_RLOTTIE=ON \
            -DCONFIG_LV_USE_IME_PINYIN=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Stage outputs in out folder
        run: |
          mkdir -p out
          cp -a build out/build
          test -d out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-linux-arm64
          path: out
          if-no-files-found: error

  build-and-package-fedora:
    runs-on: ubuntu-24.04
    container: fedora:44

    steps:
      - name: Install prerequisites
        # actions/checkout needs git present before it runs, and
        # actions/setup-python isn't reliable inside arbitrary containers, so
        # both git and python3 are installed here via dnf instead.
        run: |
          dnf install -y \
            git \
            cmake ninja-build gcc gcc-c++ make pkgconf-pkg-config \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            ffmpeg-free-devel \
            mesa-libEGL-devel libglvnd-devel \
            wayland-devel wayland-protocols-devel \
            libdrm-devel mesa-libgbm-devel \
            libinput-devel libxkbcommon-devel systemd-devel freetype-devel \
            libpng-devel libjpeg-turbo-devel libwebp-devel libevdev-devel \
            python3 python3-pip
          python3 -m pip install kconfiglib

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        shell: bash
        run: |
          INSTALL_PREFIX="$PWD/out/install"
          mkdir -p "$INSTALL_PREFIX"
          cmake -B build -GNinja \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/linux-3d.defconfig \
            -DCONFIG_LV_USE_GSTREAMER=ON \
            -DCONFIG_LV_USE_GLTF=ON \
            -DCONFIG_LV_USE_3DTEXTURE=ON \
            -DCONFIG_LV_USE_FFMPEG=ON \
            -DCONFIG_LV_USE_IME_PINYIN=ON \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Stage outputs in out folder
        shell: bash
        run: |
          mkdir -p out
          cp -a build out/build
          test -d "$PWD/out/install"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-fedora
          path: out
          if-no-files-found: error

  build-and-package-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: |
          brew update
          brew install ninja
          python3 -m pip install kconfiglib

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/empty.defconfig \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Stage outputs in out folder
        run: |
          mkdir -p out
          cp -a build out/build
          test -d out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-macos
          path: out
          if-no-files-found: error

  build-and-package-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: scripts\install-prerequisites.bat

      - name: Configure CMake
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build/windows-base',
            '-G', 'Visual Studio 17 2022',
            '-A', 'x64',
            '-DBUILD_SHARED_LIBS=ON',
            '-DLV_BUILD_USE_KCONFIG=ON',
            '-DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/empty.defconfig',
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/build/install/windows-base"
          )
          & cmake @cmakeArgs

      - name: Build
        run: cmake --build build/windows-base --config Release --parallel

      - name: Install
        run: cmake --install build/windows-base --config Release

      - name: Stage outputs in out folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item -Recurse -Force build/windows-base out/build
          Copy-Item -Recurse -Force build/install/windows-base out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-windows
          path: out
          if-no-files-found: error
