max-files-changed: 40
changed-files-labels-limit: 15

##############################################################################
# Meta / infrastructure
##############################################################################

docs:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - 'docs/**'
              - '**/*.md'
              - '**/*.mdx'
      - changed-files:
          - all-globs-to-all-files:
              - '!src/**'
              - '!include/**'

tests:
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - 'tests/**'
              - 'gcovr.cfg'
              - 'docs/src/contributing/running_tests.mdx'
      - changed-files:
